<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Green Gradient (Mission LiFE Nature) -->
    <linearGradient id="ggGreen" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#0E5E33" />
      <stop offset="45%" stop-color="#16834A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Secondary Soft Green Accent -->
    <linearGradient id="ggLightGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16834A" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>

    <!-- Solar Sun Gold Gradient (Clean Gujarat Solar) -->
    <linearGradient id="ggSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Clean Blue Water / Wind Energy Gradient -->
    <linearGradient id="ggBlue" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Subtle Background Glow -->
    <radialGradient id="ggGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Shield / Badge Gradient -->
    <linearGradient id="ggBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>

    <filter id="ggShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0E5E33" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#ggGlow)" />

  <!-- Shield Base Contour -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#ggBadge)" stroke="#86EFAC" stroke-width="2" stroke-opacity="0.6" filter="url(#ggShadow)" />

  <!-- Solar Rays Arc (Gujarat Clean Solar Energy) -->
  <g stroke="url(#ggSun)" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
    <line x1="38" y1="36" x2="30" y2="28" />
    <line x1="48" y1="30" x2="48" y2="20" />
    <line x1="58" y1="36" x2="66" y2="28" />
    <line x1="28" y1="46" x2="18" y2="46" />
  </g>

  <!-- Solar Core / Sun Disk -->
  <circle cx="44" cy="48" r="14" fill="url(#ggSun)" />

  <!-- Clean Energy Dynamic Blue Arc (Wind / Hydro / Transition) -->
  <path d="M26 78 C34 90, 52 94, 68 88 C58 84, 52 76, 50 68 C40 70, 32 72, 26 78 Z" fill="url(#ggBlue)" opacity="0.92" />

  <!-- Primary Green Mission LiFE Leaf (Gracefully sweeping from bottom-center to top-right) -->
  <path d="M46 88 C46 88, 54 62, 78 44 C88 36, 96 30, 98 22 C98 22, 98 34, 88 52 C76 74, 58 86, 46 88 Z" fill="url(#ggGreen)" />

  <!-- Secondary Complementary Leaf Curve -->
  <path d="M46 88 C46 88, 62 82, 76 68 C86 58, 92 48, 98 22 C88 28, 72 36, 62 48 C52 60, 48 76, 46 88 Z" fill="url(#ggLightGreen)" opacity="0.85" />

  <!-- Central Leaf Vein (Precision Spine) -->
  <path d="M48 86 Q68 62 96 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Vein Side Branches -->
  <path d="M60 70 Q68 68 76 70" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
  <path d="M70 56 Q78 52 86 54" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
  <path d="M78 44 Q86 40 92 40" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

  <!-- Energy Sprout Accent (Gujarat Future) -->
  <circle cx="98" cy="22" r="3" fill="#FDE047" stroke="#16834A" stroke-width="1" />
</svg>
